<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="aurora1" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora3" cx="60%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#14F195" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14F195"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#14F195" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Deep space background -->
  <rect width="1200" height="630" fill="#050816"/>

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Aurora ambient glows -->
  <rect width="1200" height="630" fill="url(#aurora1)"/>
  <rect width="1200" height="630" fill="url(#aurora2)"/>
  <rect width="1200" height="630" fill="url(#aurora3)"/>

  <!-- Outer frame border -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Monogram Logo badge -->
  <g transform="translate(80, 84)">
    <rect width="64" height="64" rx="16" fill="rgba(255, 255, 255, 0.04)" stroke="url(#borderGrad)" stroke-width="1.5"/>
    <text x="32" y="42" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" font-weight="bold" fill="url(#auroraGrad)" text-anchor="middle">CR</text>
  </g>

  <!-- Status pill -->
  <g transform="translate(160, 96)">
    <rect width="260" height="40" rx="20" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <circle cx="20" cy="20" r="5" fill="#14F195"/>
    <text x="36" y="25" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">Available for Work &amp; Collabs</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="250" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="76" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.03em">Chandra Sekhar</text>
  <text x="80" y="335" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="76" font-weight="800" fill="url(#auroraGrad)" letter-spacing="-0.03em">Reddy</text>

  <!-- Subheadline -->
  <text x="80" y="405" font-family="'Inter', -apple-system, sans-serif" font-size="26" font-weight="500" fill="#94A3B8">
    Full Stack Developer &amp; Next.js Engineer · Computer Science Engineering
  </text>

  <!-- Tech tags -->
  <g transform="translate(80, 465)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="110" height="38" rx="19" fill="rgba(124, 58, 237, 0.18)" stroke="rgba(124, 58, 237, 0.4)" stroke-width="1"/>
    <text x="55" y="24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">React 19</text>

    <!-- Tag 2 -->
    <rect x="122" y="0" width="110" height="38" rx="19" fill="rgba(6, 182, 212, 0.18)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1"/>
    <text x="177" y="24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Next.js</text>

    <!-- Tag 3 -->
    <rect x="244" y="0" width="135" height="38" rx="19" fill="rgba(20, 241, 149, 0.18)" stroke="rgba(20, 241, 149, 0.4)" stroke-width="1"/>
    <text x="311" y="24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">TypeScript</text>

    <!-- Tag 4 -->
    <rect x="391" y="0" width="115" height="38" rx="19" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="448" y="24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Node.js</text>

    <!-- Tag 5 -->
    <rect x="518" y="0" width="135" height="38" rx="19" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="585" y="24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Tailwind v4</text>
  </g>

  <!-- Footer branding in image -->
  <text x="80" y="555" font-family="'JetBrains Mono', monospace" font-size="15" fill="#64748B">chandrasekharreddy.dev</text>
  <text x="1120" y="555" font-family="'JetBrains Mono', monospace" font-size="15" fill="#64748B" text-anchor="end">Production Portfolio 2026</text>
</svg>

